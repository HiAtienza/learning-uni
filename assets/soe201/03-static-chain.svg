<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 370" role="img"><title>A collision chooses a bucket, not a unique record</title><desc>SOE201 educational diagram; labels and connections are explained in the adjacent text.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52657B"/></marker></defs><rect width="850" height="370" rx="14" fill="#F5F7FB"/><text x="25" y="30" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#117D83" text-anchor="start">A collision chooses a bucket, not a unique record</text><rect x="30" y="70" width="210" height="70" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="135.0" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Key 15151</text><text x="135.0" y="124.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">digit sum = 13</text><rect x="320" y="70" width="210" height="70" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="425.0" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">13 mod 8 = 5</text><text x="425.0" y="124.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">bucket address 5</text><line x1="245" y1="105" x2="315" y2="105" stroke="#52657B" stroke-width="2" marker-end="url(#a)"/><rect x="300" y="215" width="240" height="100" rx="7" fill="#E6F3F1" stroke="#CED8E5"/><text x="420.0" y="260.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Bucket 5</text><text x="420.0" y="284.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">15151, 33456</text><rect x="590" y="215" width="230" height="100" rx="7" fill="#FFF0D9" stroke="#CED8E5"/><text x="705.0" y="260.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Overflow</text><text x="705.0" y="284.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">58583, 98345</text><line x1="430" y1="145" x2="430" y2="209" stroke="#52657B" stroke-width="2" marker-end="url(#a)"/><line x1="545" y1="265" x2="585" y2="265" stroke="#52657B" stroke-width="2" marker-end="url(#a)"/><text x="30" y="350" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B42" text-anchor="start">Compare the full search key, including every overflow page when needed.</text></svg>