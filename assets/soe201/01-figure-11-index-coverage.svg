<text x="194" y="216" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#172B42">Representative 10</text>
<line x1="194" y1="239" x2="194" y2="268" stroke="#52657B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="276" width="316" height="58" rx="10" fill="#E6EDF9" stroke="#CED8E5"/>
<text x="194" y="311" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#172B42">D0: 10, 14, 19</text>
