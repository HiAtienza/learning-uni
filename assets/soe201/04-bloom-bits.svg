<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 410" role="img"><title>Bloom filter: definitely absent or possibly present</title><desc>SOE201 educational diagram; labels and connections are explained in the adjacent text.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52657B"/></marker></defs><rect width="850" height="410" rx="14" fill="#F5F7FB"/><text x="25" y="30" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#117D83" text-anchor="start">Bloom filter: definitely absent or possibly present</text><text x="30" y="76" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B42" text-anchor="start">S = {2, 5}; 12 bits; h1(x) = x mod 12; h2(x) = (5x + 1) mod 12</text><text x="57" y="115" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B42" text-anchor="middle">0</text><rect x="30" y="130" width="54" height="50" rx="7" fill="#FFFFFF" stroke="#CED8E5"/><text x="57.0" y="162.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">0</text><text x="123" y="115" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B42" text-anchor="middle">1</text><rect x="96" y="130" width="54" height="50" rx="7" fill="#FFFFFF" stroke="#CED8E5"/><text x="123.0" y="162.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">0</text><text x="189" y="115" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B42" text-anchor="middle">2</text><rect x="162" y="130" width="54" height="50" rx="7" fill="#E6F3F1" stroke="#CED8E5"/><text x="189.0" y="162.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">1</text><text x="255" y="115" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B42" text-anchor="middle">3</text><rect x="228" y="130" width="54" height="50" rx="7" fill="#FFFFFF" stroke="#CED8E5"/><text x="255.0" y="162.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">0</text><text x="321" y="115" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B42" text-anchor="middle">4</text><rect x="294" y="130" width="54" height="50" rx="7" fill="#FFFFFF" stroke="#CED8E5"/><text x="321.0" y="162.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">0</text><text x="387" y="115" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B42" text-anchor="middle">5</text><rect x="360" y="130" width="54" height="50" rx="7" fill="#E6F3F1" stroke="#CED8E5"/><text x="387.0" y="162.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">1</text><text x="453" y="115" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B42" text-anchor="middle">6</text><rect x="426" y="130" width="54" height="50" rx="7" fill="#FFFFFF" stroke="#CED8E5"/><text x="453.0" y="162.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">0</text><text x="519" y="115" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B42" text-anchor="middle">7</text><rect x="492" y="130" width="54" height="50" rx="7" fill="#FFFFFF" stroke="#CED8E5"/><text x="519.0" y="162.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">0</text><text x="585" y="115" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B42" text-anchor="middle">8</text><rect x="558" y="130" width="54" height="50" rx="7" fill="#FFFFFF" stroke="#CED8E5"/><text x="585.0" y="162.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">0</text><text x="651" y="115" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B42" text-anchor="middle">9</text><rect x="624" y="130" width="54" height="50" rx="7" fill="#FFFFFF" stroke="#CED8E5"/><text x="651.0" y="162.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">0</text><text x="717" y="115" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B42" text-anchor="middle">10</text><rect x="690" y="130" width="54" height="50" rx="7" fill="#FFFFFF" stroke="#CED8E5"/><text x="717.0" y="162.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">0</text><text x="783" y="115" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B42" text-anchor="middle">11</text><rect x="756" y="130" width="54" height="50" rx="7" fill="#E6F3F1" stroke="#CED8E5"/><text x="783.0" y="162.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">1</text><rect x="30" y="230" width="370" height="95" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="215.0" y="272.5" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Query 8 → positions 8 and 5</text><text x="215.0" y="296.5" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">bit 8 = 0 → definitely absent</text><rect x="450" y="230" width="370" height="95" rx="7" fill="#FFF0D9" stroke="#CED8E5"/><text x="635.0" y="272.5" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Query 14 → positions 2 and 11</text><text x="635.0" y="296.5" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">both 1 → possible; exact set rejects</text><text x="30" y="375" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172B42" text-anchor="start">A bit position is a hash result, not a record number. Synthetic teaching case.</text></svg>