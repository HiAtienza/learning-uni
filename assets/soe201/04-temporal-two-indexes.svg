<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 410" role="img"><title>Temporal lookup combines current and historical indexes</title><desc>SOE201 educational diagram; labels and connections are explained in the adjacent text.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52657B"/></marker></defs><rect width="850" height="410" rx="14" fill="#F5F7FB"/><text x="25" y="30" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#117D83" text-anchor="start">Temporal lookup combines current and historical indexes</text><rect x="230" y="65" width="390" height="60" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="425.0" y="102.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Query: key a = v, valid at time t</text><line x1="320" y1="130" x2="215" y2="195" stroke="#52657B" stroke-width="2" marker-end="url(#a)"/><line x1="530" y1="130" x2="635" y2="195" stroke="#52657B" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="205" width="370" height="100" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="215.0" y="238.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Current tuples · B+ tree</text><text x="215.0" y="262.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">key (a, start)</text><text x="215.0" y="286.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">match a = v and start ≤ t</text><rect x="450" y="205" width="370" height="100" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="635.0" y="238.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Historical tuples · spatial index</text><text x="635.0" y="262.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">finite time interval</text><text x="635.0" y=