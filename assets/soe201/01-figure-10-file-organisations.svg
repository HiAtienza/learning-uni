<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="785" viewBox="0 0 1080 785" role="img" aria-labelledby="title desc"><title id="title">Figure 10: File organisation changes what stays nearby</title><desc id="desc">Heap placement, ordered overflow, and multitable groups emphasise different access patterns.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52657B"/></marker></defs><rect width="1080" height="785" rx="18" fill="#F5F7FB"/>
<text x="36" y="35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#117D83">SOE201  /  PHYSICAL STORAGE  /  FIGURE 10</text>
<text x="36" y="76" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#172B42">File organisation changes what stays nearby</text>
<text x="36" y="109" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52657B">Heap placement, ordered overflow, and multitable groups emphasise different access patterns.</text>
<text x="36" y="160" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#117D83">HEAP · place records where they fit</text>
