<text x="497" y="596" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#52657B">student + 5 module records</text>
<rect x="660" y="543" width="298" height="70" rx="10" fill="#E6EDF9" stroke="#CED8E5"/>
<text x="809" y="571" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#172B42">Group C · 1300 B</text>
<text x="809" y="596" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#52657B">student + 5 module records</text>
<rect x="978" y="543" width="66" height="70" rx="10" fill="#FFF0CC" stroke="#CED8E5"/>
<text x="1011" y="577" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#9B6500">196</text>
<text x="1011" y="598" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#9B6500">free</text>
<text x="36" y="658" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#117D83">One group = 300 + 5 × 200 = 1300 bytes. A fourth whole group will not fit.</text>
