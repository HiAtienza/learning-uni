<text x="191" y="214" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#172B42">Page 0: 28, 10</text>
<rect x="371" y="180" width="310" height="55" rx="10" fill="#E6EDF9" stroke="#CED8E5"/>
<text x="526" y="214" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#172B42">Page 1: 35, 14</text>
<rect x="706" y="180" width="310" height="55" rx="10" fill="#E6EDF9" stroke="#CED8E5"/>
<text x="861" y="214" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#172B42">Page 2: 19, 23</text>
<text x="36" y="265" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#52657B">Free-space map → candidate page → check actual space → insert → update map</text>
<text x="36" y="315" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#117D83">ORDERED · preserve the logical chain through overflow</text>
<rect x="36" y="335" width="360" height="60" rx="10" fill="#E6F3F1" stroke="#CED8E5"/>
<text x="216" y="372" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#172B42">D0: 10, 14, 19</text>
<rect x="420" y="335" width="360" height="60" rx="10" fill="#E6F3F1" stroke="#CED8E5"/>
<text x="600" y="372" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#172B42">D1: 23, 28, 35</text>
<rect x="805" y="335" width="239" height="60" rx="10" fill="#FFF0CC" stroke="#CED8E5"/>
<text x="924" y="372" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#172B42">Overflow: 16</text>
<text x="36" y="432" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#117D83">Logical scan: 10 → 14 → 16 → 19 → 23 → 28 → 35</text>
<text x="36" y="468" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52657B">After reorganisation: [10,14,16]   [19,23,28]   [35]</text>
<text x="36" y="521" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#117D83">MULTITABLE · related records stay in one block</text>
