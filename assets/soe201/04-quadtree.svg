<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" role="img"><title>Quadtree: divide each crowded region into four equal parts</title><desc>SOE201 educational diagram; labels and connections are explained in the adjacent text.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52657B"/></marker></defs><rect width="820" height="620" rx="14" fill="#F5F7FB"/><text x="25" y="30" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#117D83" text-anchor="start">Quadtree: divide each crowded region into four equal parts</text><rect x="80" y="100" width="440" height="440" fill="#52657B" fill-opacity="0" stroke="#52657B" stroke-width="2"/><text x="80" y="565" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#172B42" text-anchor="middle">0</text><text x="60" y="546" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#172B42" text-anchor="middle">0</text><text x="168" y="565" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#172B42" text-anchor="middle">2</text><text x="60" y="458" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#172B42" text-anchor="middle">2</text><text x="256" y="565" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#172B42" text-anchor="middle">4</text><text x="60" y="370" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#172B42" text-anchor="middle">4</text><text x="344" y="565" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#172B42" text-anchor="middle">6</text><text x="60" y="282" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#172B42" text-anchor="middle">6</text><text x="432" y="565" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#172B42" text-anchor="middle">8</text><text x="60" y="194" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#172B42" text-anchor="middle">8</text><text x="520" y="565" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#172B42" text-anchor="middle">10</text><text x="60" y="106" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#172B42" text-anchor="middle">10</text><line x1="300" y1="540" x2="300" y2="100" stroke="#117D83" stroke-width="2"/><line x1="80" y1="320" x2="520" y2="320" stroke="#117D83" stroke-width="2"/><line x1="190.0" y1="540" x2="190.0" y2="320" stroke="#117D83" stroke-width="2"/><line x1="80" y1="430.0" x2="300" y2="430.0" stroke="#117D83" stroke-width="2"/><line x1="410.0" y1="320" x2="410.0" y2="100" stroke="#117D83" stroke-width="2"/><line x1="300" y1="210.0" x2="520" y2="210.0" stroke="#117D83" stroke-width="2"/><text x="560" y="170" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">Capacity: 1 point</text><text x="560" y="215" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">Split SW and NE</text><text x="560" y="260" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">at their midpoints.</text><text x="560" y="330" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">Empty quadrants</text><text x="560" y="365" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">remain valid leaves.</text><circle cx="124" cy="496" r="5" fill="#172B42"/><text x="134" y="488" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">A</text><circle cx="168" cy="276" r="5" fill="#172B42"/><text x="178" y="268" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">B</text><circle cx="256" cy="408" r="5" fill="#172B42"/><text x="266" y="400" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">C</text><circle cx="344" cy="232" r="5" fill="#172B42"/><text x="354" y="224" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">D</text><circle cx="388" cy="452" r="5" fill="#172B42"/><text x="398" y="444" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">E</text><circle cx="476" cy="320" r="5" fill="#172B42"/><text x="486" y="312" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">F</text><text x="80" y="600" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B42" text-anchor="start">Coordinates are synthetic. Right/top side owns a point on a split boundary.</text></svg>