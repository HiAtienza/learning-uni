<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 620" role="img"><title>Overlapping child boxes can retain a false candidate</title><desc>SOE201 educational diagram; labels and connections are explained in the adjacent text.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52657B"/></marker></defs><rect width="850" height="620" rx="14" fill="#F5F7FB"/><text x="25" y="30" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#117D83" text-anchor="start">Overlapping child boxes can retain a false candidate</text><rect x="100" y="100" width="320" height="320" fill="#E6EDF9" stroke="#52657B" stroke-width="2" stroke-dasharray="8 6"/><polygon points="100,420 420,420 100,100" fill="#CCDDF0" stroke="#172B42" stroke-width="2"/><rect x="330" y="180" width="200" height="300" fill="#E6F3F1" fill-opacity="0.65" stroke="#117D83" stroke-width="2"/><rect x="370" y="210" width="24" height="24" fill="#FFF0D9" stroke="#B77B25" stroke-width="3"/><text x="110" y="80" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">Child 1: exact bounding box of T</text><text x="355" y="515" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">Child 2: rectangle R</text><text x="160" y="360" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172B42" text-anchor="start">Triangle T</text><text x="610" y="205" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">Query Q</text><line x1="600" y1="208" x2="401" y2="221" stroke="#52657B" stroke-width="2" marker-end="url(#a)"/><text x="575" y="295" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B42" text-anchor="start">Visit both children.</text><text x="575" y="345" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B42" text-anchor="start">Exact test:</text><text x="575" y="380" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B42" text-anchor="start">T → no match</text><text x="575" y="415" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172B42" text-anchor="start">R → match</text><text x="30" y="567" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172B42" text-anchor="start">Q intersects both child boxes, but misses triangle T. The drawing is schematic.</text><text x="30" y="597" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172B42" text-anchor="start">Dashed box: T’s minimum rectangle. The rectangle R is its own exact box.</text></svg>