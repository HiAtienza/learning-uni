<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img"><title>Redistribution rotates a boundary through the parent</title><desc>SOE201 educational diagram; labels and connections are explained in the adjacent text.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52657B"/></marker></defs><rect width="800" height="410" rx="14" fill="#F5F7FB"/><text x="25" y="30" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#117D83" text-anchor="start">Redistribution rotates a boundary through the parent</text><rect x="290" y="60" width="220" height="48" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="400.0" y="91.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Parent: 50</text><rect x="30" y="145" width="340" height="75" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="200.0" y="177.5" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Left internal: 20 | 35</text><text x="200.0" y="201.5" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">children: A, B, C</text><rect x="430" y="145" width="340" height="75" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="600.0" y="177.5" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Right internal: empty</text><text x="600.0" y="201.5" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">child: D</text><line x1="400" y1="110" x2="200" y2="140" stroke="#52657B" stroke-width="2" marker-end="url(#a)"/><line x1="400" y1="110" x2="600" y2="140" stroke="#52657B" stroke-width="2" marker-end="url(#a)"/><text x="30" y="255" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">Move child C to the right; 50 moves down; 35 moves up.</text><rect x="290" y="275" width="220" height="48" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="400.0" y="306.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Parent: 35</text><rect x="30" y="340" width="340" height="55" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="200.0" y="374.5" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Left: 20 · children A, B</text><rect x="430" y="340" width="340" height="55" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="600.0" y="374.5" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Right: 50 · children C, D</text></svg>