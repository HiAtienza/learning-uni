<text x="756" y="496" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#172B42">Hall-B</text>
<text x="596" y="549" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#52657B">16</text>
