<text x="54" y="483" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#172B42">16-byte prefix: descriptors + null metadata</text>
<text x="54" y="509" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#117D83">name (16,3)    address (19,6)</text>
