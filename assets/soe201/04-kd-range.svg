, Helvetica, sans-serif" font-size="16" fill="#172B42" text-anchor="middle">10</text><text x="60" y="106" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#172B42" text-anchor="middle">10</text><line x1="300" y1="540" x2="300" y2="100" stroke="#117D83" stroke-width="2"/><line x1="80" y1="364" x2="300" y2="364" stroke="#117D83" stroke-width="2"/><line x1="300" y1="364" x2="520" y2="364" stroke="#117D83" stroke-width="2"/><rect x="212" y="276" width="220" height="220" fill="#E2AA42" fill-opacity=".25" stroke="#E2AA42" stroke-width="2"/><text x="560" y="160" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">Root: x = 5</text><text x="560" y="200" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">Next: y = 4</text><text x="560" y="255" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">Query rectangle:</text><text x="560" y="290" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">x ∈ [3,8]</text><text x="560" y="325" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">y ∈ [1,6]</text><text x="560" y="385" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">Result: C, E</text><circle cx="124" cy="496" r="5" fill="#172B42"/><text x="134" y="488" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">A</text><circle cx="168" cy="276" r="5" fill="#172B42"/><text x="178" y="268" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">B</text><circle cx="256" cy="408" r="5" fill="#172B42"/><text x="266" y="400" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="start">C</text><circle cx="344" cy="232" r="5" fill="#172B42"/><text x="354" y="224" font-family="Arial, Helvetica, sans-serif" font-size="20" fill