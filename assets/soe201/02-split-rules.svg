<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img"><title>Leaf split copies; internal split promotes</title><desc>SOE201 educational diagram; labels and connections are explained in the adjacent text.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52657B"/></marker></defs><rect width="800" height="390" rx="14" fill="#F5F7FB"/><text x="25" y="30" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#117D83" text-anchor="start">Leaf split copies; internal split promotes</text><rect x="30" y="70" width="340" height="65" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="200.0" y="97.5" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Leaf overflow (order 4)</text><text x="200.0" y="121.5" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">10, 20, 30, 40</text><rect x="430" y="70" width="340" height="65" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="600.0" y="97.5" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Internal overflow (order 4)</text><text x="600.0" y="121.5" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">7 | 13 | 19 | 31</text><line x1="200" y1="140" x2="200" y2="185" stroke="#52657B" stroke-width="2" marker-end="url(#a)"/><line x1="600" y1="140" x2="600" y2="185" stroke="#52657B" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="190" width="280" height="50" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="200.0" y="222.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Parent receives copy: 30</text><rect x="460" y="190" width="280" height="50" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="600.0" y="222.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Parent receives 