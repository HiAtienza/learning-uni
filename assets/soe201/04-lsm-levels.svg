<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img"><title>Batch writes; search every relevant level</title><desc>SOE201 educational diagram; labels and connections are explained in the adjacent text.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52657B"/></marker></defs><rect width="800" height="640" rx="14" fill="#F5F7FB"/><text x="25" y="30" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#117D83" text-anchor="start">Batch writes; search every relevant level</text><rect x="230" y="65" width="340" height="70" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="400.0" y="95.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Memory L0</text><text x="400.0" y="119.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">new sorted entries</text><line x1="400" y1="140" x2="400" y2="185" stroke="#52657B" stroke-width="2" marker-end="url(#a)"/><rect x="180" y="195" width="440" height="80" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="400.0" y="230.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Disk L1 · threshold k × L0</text><text x="400.0" y="254.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">merge old L1 with incoming batch</text><line x1="400" y1="280" x2="400" y2="325" stroke="#52657B" stroke-width="2" marker-end="url(#a)"/><rect x="130" y="335" width="540" height="80" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="400.0" y="370.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Disk L2 · threshold k × L1</text><text x="400.0" y="394.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">larger sorted structure</text><line x1="400" y1="420" x2="400" y2="465" stroke="#52657B" stroke-width="2" marker-end="url(#a)"/><rect x="80" y="475" width="640" height="80" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="400.0" y="510.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Disk L3</text><text x="400.0" y="534.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">queries may need several levels</text><text x="30" y="602" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172B42" text-anchor="start">Tombstone + older record → suppress the record until safe to discard both.</text></svg>