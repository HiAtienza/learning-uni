<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img"><title>A buffer tree moves batches down the search path</title><desc>SOE201 educational diagram; labels and connections are explained in the adjacent text.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52657B"/></marker></defs><rect width="800" height="440" rx="14" fill="#F5F7FB"/><text x="25" y="30" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#117D83" text-anchor="start">A buffer tree moves batches down the search path</text><rect x="230" y="65" width="340" height="80" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="400.0" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Root separator 50</text><text x="400.0" y="124.0" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">buffer: insert 12, insert 73</text><line x1="350" y1="150" x2="200" y2="225" stroke="#52657B" stroke-width="2" marker-end="url(#a)"/><line x1="450" y1="150" x2="600" y2="225" stroke="#52657B" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="235" width="320" height="85" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="200.0" y="272.5" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Child range &lt; 50</text><text x="200.0" y="296.5" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">buffer receives insert 12</text><rect x="440" y="235" width="320" height="85" rx="7" fill="#E6EDF9" stroke="#CED8E5"/><text x="600.0" y="272.5" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">Child range ≥ 50</text><text x="600.0" y="296.5" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172B42" text-anchor="middle">buffer receives insert 73</text><text x="30" y="373" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172B42" text-anchor="start">Flush groups by destination; queries must account for pending buffered entries.</text><text x="30" y="408" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172B42" text-anchor="start">A buffer is part of index maintenance, not permission to ignore fresh records.</text></svg>