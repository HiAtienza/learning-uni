<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 670" width="720" height="670" role="img"><title>Reuse: needs meet available capabilities</title><desc>Source sequence from Week 2 lecture page 47; two requirements activities have different information available.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#347789"/></marker></defs><rect width="720" height="670" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#142d42"><text x="360" y="34" text-anchor="middle" font-size="23" font-weight="bold">Reuse: needs meet available capabilities</text><rect x="65" y="55" width="590" height="73" rx="8" fill="#e7eff7" stroke="#7097b4"/><text x="360" y="83" text-anchor="middle" font-size="21" font-weight="bold">Requirements specification</text><text x="360" y="108" text-anchor="middle" font-size="17">Establish broad needs before selecting components</text><path d="M360,130 V151" stroke="#347789" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="155" width="590" height="73" rx="8" fill="#e7eff7" stroke="#7097b4"/><text x="360" y="183" text-anchor="middle" font-size="21" font-weight="bold">Component analysis</text><text x="360" y="208" text-anchor="middle" font-size="17">Evaluate the capabilities and limits of candidates</text><path d="M360,230 V251" stroke="#347789" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="255" width="590" height="73" rx="8" fill="#e7eff7" stroke="#7097b4"/><text x="360" y="283" text-anchor="middle" font-size="21" font-weight="bold">Requirements modification</text><text x="360" y="308" text-anchor="middle" font-size="17">Negotiate feasible fit; preserve essential business needs</text><path d="M360,330 V351" stroke="#347789" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="355" width="590" height="73" rx="8" fill="#e7eff7" stroke="#7097b4"/><text x="360" y="383" text-anchor="middle" font-size="21" font-weight="bold">System design with reuse</text><text x="360" y="408" text-anchor="middle" font-size="17">Arrange reused parts and identify missing responsibilities</text><path d="M360,430 V451" stroke="#347789" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="455" width="590" height="73" rx="8" fill="#e7eff7" stroke="#7097b4"/><text x="360" y="483" text-anchor="middle" font-size="21" font-weight="bold">Development and integration</text><text x="360" y="508" text-anchor="middle" font-size="17">Configure, adapt and build necessary additions</text><path d="M360,530 V551" stroke="#347789" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="555" width="590" height="73" rx="8" fill="#e7eff7" stroke="#7097b4"/><text x="360" y="583" text-anchor="middle" font-size="21" font-weight="bold">System validation</text><text x="360" y="608" text-anchor="middle" font-size="17">Check the resulting whole against the agreed needs</text></g></svg>