<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 570" width="720" height="570" role="img"><title>A requirement keeps its reason and its evidence</title><desc>Informal traceability chain. Down means refinement or realization, not event sequence. Backward tracing explains why an artifact exists.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#347789"/></marker></defs><rect width="720" height="570" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#142d42"><text x="360" y="34" text-anchor="middle" font-size="23" font-weight="bold">A requirement keeps its reason and its evidence</text><rect x="65" y="55" width="590" height="73" rx="8" fill="#e7eff7" stroke="#7097b4"/><text x="360" y="83" text-anchor="middle" font-size="21" font-weight="bold">E-002: raw lecturer need</text><text x="360" y="108" text-anchor="middle" font-size="17">Urgent room changes currently depend on email</text><path d="M360,130 V151" stroke="#347789" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="155" width="590" height="73" rx="8" fill="#e7eff7" stroke="#7097b4"/><text x="360" y="183" text-anchor="middle" font-size="21" font-weight="bold">UR-2 + E-003: goal and approval constraint</text><text x="360" y="208" text-anchor="middle" font-size="17">Request an urgent swap; retain administrator sign-off</text><path d="M360,230 V251" stroke="#347789" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="255" width="590" height="73" rx="8" fill="#e7eff7" stroke="#7097b4"/><text x="360" y="283" text-anchor="middle" font-size="21" font-weight="bold">SR-2.1: precise system rule</text><text x="360" y="308" text-anchor="middle" font-size="17">Reject a room whose capacity is below enrollment</text><path d="M360,330 V351" stroke="#347789" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="355" width="590" height="73" rx="8" fill="#e7eff7" stroke="#7097b4"/><text x="360" y="383" text-anchor="middle" font-size="21" font-weight="bold">Design and implementation references</text><text x="360" y="408" text-anchor="middle" font-size="17">SwapModule and CapacityChecker serve distinct parts</text><path d="M360,430 V451" stroke="#347789" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="455" width="590" height="73" rx="8" fill="#e7eff7" stroke="#7097b4"/><text x="360" y="483" text-anchor="middle" font-size="21" font-weight="bold">Test references and results</text><text x="360" y="508" text-anchor="middle" font-size="17">TC-UI-105 and TC-UNIT-402; record actual evidence</text></g></svg>