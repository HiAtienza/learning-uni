<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img"><title>Empirical control: make learning actionable</title><desc>Informal reasoning cycle shown vertically. The final step returns to transparency; it is not a sequence of project phases.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#347789"/></marker></defs><rect width="720" height="470" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#142d42"><text x="360" y="34" text-anchor="middle" font-size="23" font-weight="bold">Empirical control: make learning actionable</text><rect x="65" y="55" width="590" height="73" rx="8" fill="#e7eff7" stroke="#7097b4"/><text x="360" y="83" text-anchor="middle" font-size="21" font-weight="bold">Transparency</text><text x="360" y="108" text-anchor="middle" font-size="17">Expose work, uncertainty and the shared quality standard</text><path d="M360,130 V151" stroke="#347789" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="155" width="590" height="73" rx="8" fill="#e7eff7" stroke="#7097b4"/><text x="360" y="183" text-anchor="middle" font-size="21" font-weight="bold">Inspection</text><text x="360" y="208" text-anchor="middle" font-size="17">Compare evidence with the goal; identify a meaningful gap</text><path d="M360,230 V251" stroke="#347789" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="255" width="590" height="73" rx="8" fill="#e7eff7" stroke="#7097b4"/><text x="360" y="283" text-anchor="middle" font-size="21" font-weight="bold">Adaptation</text><text x="360" y="308" text-anchor="middle" font-size="17">Change the plan or practice while preserving the goal</text><path d="M360,330 V351" stroke="#347789" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="355" width="590" height="73" rx="8" fill="#e7eff7" stroke="#7097b4"/><text x="360" y="383" text-anchor="middle" font-size="21" font-weight="bold">Repeat with new evidence</text><text x="360" y="408" text-anchor="middle" font-size="17">Inspect the consequences of the adjustment</text></g></svg>