<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 650" width="720" height="650" role="img"><title>Timetabling System use cases</title><desc>Student and Lecturer participate in schedule viewing and room/time requests. Facility Administrator participates in approval, allocations and reports. Plain association lines do not encode order.</desc><rect width="720" height="650" fill="#f8fafc"/><g stroke="#345875" stroke-width="2" fill="none"><rect x="265" y="35" width="430" height="590"/><path d="M120,115 L345,125"/><path d="M120,115 L345,230"/><path d="M120,250 L345,125"/><path d="M120,250 L345,230"/><path d="M120,455 L345,340"/><path d="M120,455 L345,450"/><path d="M120,455 L345,560"/><circle cx="90" cy="88" r="12" fill="#f8fafc"/><path d="M90,100 V137 M65,115 H120 M90,137 L70,161 M90,137 L110,161"/><circle cx="90" cy="223" r="12" fill="#f8fafc"/><path d="M90,235 V272 M65,250 H120 M90,272 L70,296 M90,272 L110,296"/><circle cx="90" cy="428" r="12" fill="#f8fafc"/><path d="M90,440 V477 M65,455 H120 M90,477 L70,501 M90,477 L110,501"/></g><g font-family="Arial, sans-serif" text-anchor="middle" fill="#142d42" font-size="19"><text x="480" y="64" font-size="22" font-weight="bold">Timetabling System</text><text x="100" y="185">Student</text><text x="100" y="320">Lecturer</text><text x="100" y="525">Facility</text><text x="100" y="547">Administrator</text><ellipse cx="500" cy="125" rx="155" ry="40" fill="#e7eff7" stroke="#7097b4" stroke-width="2"/><text x="500" y="120">View Weekly</text><text x="500" y="144">Schedule</text><ellipse cx="500" cy="230" rx="155" ry="40" fill="#e7eff7" stroke="#7097b4" stroke-width="2"/><text x="500" y="225">Request Room /</text><text x="500" y="249">Time Swap</text><ellipse cx="500" cy="340" rx="155" ry="40" fill="#e7eff7" stroke="#7097b4" stroke-width="2"/><text x="500" y="335">Review &amp; Approve</text><text x="500" y="359">Swap Requests</text><ellipse cx="500" cy="450" rx="155" ry="40" fill="#e7eff7" stroke="#7097b4" stroke-width="2"/><text