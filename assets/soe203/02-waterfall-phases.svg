<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 570" width="720" height="570" role="img"><title>Waterfall: principal phases</title><desc>Principal forward progression. Real feedback and rework can return to earlier phases; this compact figure does not forbid them.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#347789"/></marker></defs><rect width="720" height="570" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#142d42"><text x="360" y="34" text-anchor="middle" font-size="23" font-weight="bold">Waterfall: principal phases</text><rect x="65" y="55" width="590" height="73" rx="8" fill="#e7eff7" stroke="#7097b4"/><text x="360" y="83" text-anchor="middle" font-size="21" font-weight="bold">Requirements analysis and definition</text><text x="360" y="108" text-anchor="middle" font-size="17">Agree services, constraints and documented requirements</text><path d="M360,130 V151" stroke="#347789" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="155" width="590" height="73" rx="8" fill="#e7eff7" stroke="#7097b4"/><text x="360" y="183" text-anchor="middle" font-size="21" font-weight="bold">System and software design</text><text x="360" y="208" text-anchor="middle" font-size="17">Describe structure, interfaces and component responsibilities</text><path d="M360,230 V251" stroke="#347789" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="255" width="590" height="73" rx="8" fill="#e7eff7" stroke="#7097b4"/><text x="360" y="283" text-anchor="middle" font-size="21" font-weight="bold">Implementation and unit testing</text><text x="360" y="308" text-anchor="middle" font-size="17">Build and check individual units</text><path d="M360,330 V351" stroke="#347789" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="355" width="590" height="73" rx="8" fill="#e7eff7" stroke="#7097b4"/><text x="360" y="383" text-anchor="middle" font-size="21" font-weight="bold">Integration and system testing</text><text x="360" y="408" text-anchor="middle" font-size="17">Check the combined system and its interactions</text><path d="M360,430 V451" stroke="#347789" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="455" width="590" height="73" rx="8" fill="#e7eff7" stroke="#7097b4"/><text x="360" y="483" text-anchor="middle" font-size="21" font-weight="bold">Operation and maintenance</text><text x="360" y="508" text-anchor="middle" font-size="17">Use the system and change it as needs evolve</text></g></svg>