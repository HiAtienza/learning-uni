<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 405" preserveAspectRatio="xMidYMid meet" role="img"><title>Epsilon closure surrounds each symbol step</title><desc>Compute closure at start, then union symbol targets and close again. Accept if final set intersects F.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#38546b"/></marker></defs><rect width="760" height="405" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" font-size="21" fill="#192e40" stroke-linejoin="round"><text x="28" y="38" font-weight="bold">One DFA state represents all current NFA possibilities</text><g fill="#e6f2f0" stroke="#288879" stroke-width="2"><rect x="100" y="62" width="555" height="56" rx="8"/><rect x="100" y="158" width="555" height="56" rx="8"/><rect x="100" y="254" width="555" height="56" rx="8"/></g><g text-anchor="middle"><text x="377" y="97">Initial set S₀ = ε-closure({start})</text><text x="377" y="193">Read a: union δ(q, a) over q in S</text><text x="377" y="289">Take ε-closure of that union → new S</text><text x="377" y="365">At end: accept exactly when S contains a final state.</text></g><g stroke="#38546b" stroke-width="2" marker-end="url(#arrow)"><path d="M377 118 V151"/><path d="M377 214 V247"/></g></g></svg>
