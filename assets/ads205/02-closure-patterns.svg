<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" preserveAspectRatio="xMidYMid meet" role="img"><title>NFA closure constructions</title><desc>Union chooses either machine. Concatenation crosses from A finals to B start. Star adds a fresh accepting start and returns after completed factors.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#38546b"/></marker></defs><rect width="760" height="460" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" font-size="21" fill="#192e40" stroke-linejoin="round"><text x="28" y="36" font-weight="bold">Three construction patterns</text><g font-size="20"><text x="30" y="94">Union</text><text x="30" y="214">Concatenate</text><text x="30" y="344">Star</text></g><g fill="#e8f0f6" stroke="#38546b" stroke-width="2"><circle cx="225" cy="100" r="20"/><rect x="420" y="54" width="225" height="38" rx="6"/><rect x="420" y="112" width="225" height="38" rx="6"/><rect x="205" y="185" width="160" height="60" rx="6"/><rect x="485" y="185" width="160" height="60" rx="6"/><circle cx="225" cy="346" r="23"/><circle cx="225" cy="346" r="17" fill="none"/><rect x="415" y="316" width="230" height="60" rx="6"/></g><g font-size="18" text-anchor="middle"><text x="532" y="80">A: keep its finals</text><text x="532" y="138">B: keep its finals</text><text x="285" y="209">A</text><text x="285" y="233">unmark finals</text><text x="565" y="209">B</text><text x="565" y="233">keep finals</text><text x="530" y="341">A</text><text x="530" y="365">keep finals</text></g><g fill="none" stroke="#38546b" stroke-width="2" marker-end="url(#arrow)"><path d="M245 92 L414 74"/><path d="M245 108 L414 130"/><path d="M366 216 H478"/><path d="M249 346 H408"/><path d="M600 316 C600 266 225 266 225 318"/></g><text x="322" y="76">ε</text><text x="322" y="144">ε</text><text x="414" y="199">ε</text><text x="326" y="331">ε</text><text x="330" y="270">ε from every old final</text><text x="28" y="428" font-size="18">Boxes abbreviate whole machines; bridges connect finals to starts.</text></g></svg>
