<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" preserveAspectRatio="xMidYMid meet" role="img"><title>Eliminating one internal state</title><desc>From i to k labelled A; k loop B; k to j C; direct i to j D. New label D union A B star C.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#38546b"/></marker></defs><rect width="760" height="460" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" font-size="21" fill="#192e40" stroke-linejoin="round"><text x="28" y="38" font-weight="bold">Remove k while preserving every possible route</text><g fill="#e8f0f6" stroke="#38546b" stroke-width="2"><circle cx="120" cy="165" r="31"/><circle cx="380" cy="165" r="31"/><circle cx="640" cy="165" r="31"/><circle cx="120" cy="350" r="31"/><circle cx="640" cy="350" r="31"/></g><text x="117" y="173">i</text><text x="375" y="173">k</text><text x="637" y="173">j</text><text x="117" y="358">i</text><text x="637" y="358">j</text><g fill="none" stroke="#38546b" stroke-width="2" marker-end="url(#arrow)"><path d="M152 165 H342"/><path d="M413 165 H602"/><path d="M360 139 C300 55 458 55 400 139"/><path d="M120 197 Q380 290 640 197"/><path d="M152 350 H602"/></g><text x="240" y="149">A</text><text x="505" y="149">C</text><text x="374" y="60">B</text><text x="374" y="260">D</text><text x="296" y="331">D ∪ A B* C</text><text x="28" y="418">Keep the direct route, or enter k, loop zero or more times, then exit.</text></g></svg>
