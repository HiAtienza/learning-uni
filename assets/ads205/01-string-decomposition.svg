<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" role="img"><title>A substring is a contiguous middle block</title><desc>s = x u v w z; y = u v w; v has surrounding strings xu and wz.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#38546b"/></marker></defs><rect width="760" height="360" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" font-size="21" fill="#192e40" stroke-linejoin="round"><text x="35" y="42" font-weight="bold">A substring inside a substring</text><text x="35" y="95">s =</text><g stroke="#60788c" stroke-width="2"><rect x="110" y="65" width="95" height="65" fill="#e8eef4"/><rect x="205" y="65" width="95" height="65" fill="#e6f2f0"/><rect x="300" y="65" width="95" height="65" fill="#cde6ed"/><rect x="395" y="65" width="95" height="65" fill="#e6f2f0"/><rect x="490" y="65" width="95" height="65" fill="#e8eef4"/></g><text x="150" y="106">x</text><text x="245" y="106">u</text><text x="340" y="106">v</text><text x="435" y="106">w</text><text x="530" y="106">z</text><path d="M205 145 V160 H490 V145" fill="none" stroke="#288879" stroke-width="2"/><text x="285" y="193">y = u v w</text><path d="M110 225 H300 M395 225 H585" stroke="#38546b" stroke-width="2"/><text x="177" y="257">x u</text><text x="465" y="257">w z</text><text x="35" y="318">Regroup: s = (x u) v (w z). The block v stays contiguous.</text></g></svg>
