<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 395" preserveAspectRatio="xMidYMid meet" role="img"><title>Structure of (a union ab) star</title><desc>Star applies to a union whose right child is concatenation ab.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#38546b"/></marker></defs><rect width="760" height="395" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" font-size="21" fill="#192e40" stroke-linejoin="round"><text x="28" y="38" font-weight="bold">Parse the expression before constructing a machine</text><g fill="#e6f2f0" stroke="#288879" stroke-width="2"><rect x="275" y="65" width="210" height="50" rx="7"/><rect x="275" y="155" width="210" height="50" rx="7"/><rect x="120" y="245" width="150" height="50" rx="7"/><rect x="470" y="245" width="210" height="50" rx="7"/></g><g text-anchor="middle"><text x="380" y="97">Star: repeat blocks</text><text x="380" y="187">Union: choose</text><text x="195" y="277">a</text><text x="575" y="277">Concatenate a, b</text><text x="380" y="357">One factor is either a or ab; zero factors give ε.</text></g><g stroke="#38546b" stroke-width="2" marker-end="url(#arrow)"><path d="M380 115 V149"/><path d="M335 205 L205 240"/><path d="M425 205 L565 240"/></g></g></svg>
