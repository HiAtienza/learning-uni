<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" role="img"><title>DFA for strings ending in ab</title><desc>Start q0; a goes q1; b at q0 stays. q1 a stays b goes q2. q2 a goes q1 b goes q0. q2 accepting.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#38546b"/></marker></defs><rect width="760" height="360" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" font-size="21" fill="#192e40" stroke-linejoin="round"><text x="30" y="40" font-weight="bold">Remember the useful suffix, not the whole input</text><g fill="#e8f0f6" stroke="#38546b" stroke-width="2"><circle cx="130" cy="185" r="42"/><circle cx="375" cy="185" r="42"/><circle cx="620" cy="185" r="42"/><circle cx="620" cy="185" r="35" fill="none"/></g><text x="116" y="193">q₀</text><text x="361" y="193">q₁</text><text x="606" y="193">q₂</text><g fill="none" stroke="#38546b" stroke-width="2" marker-end="url(#arrow)"><path d="M35 185 H87"/><path d="M172 175 H331"/><path d="M417 175 H576"/><path d="M580 205 Q495 278 415 205"/><path d="M620 141 Q375 30 132 141"/><path d="M102 153 C52 75 203 75 158 153"/><path d="M347 153 C304 100 446 100 402 153"/></g><text x="248" y="165">a</text><text x="493" y="165">b</text><text x="492" y="258">a</text><text x="490" y="92">b</text><text x="120" y="80">b</text><text x="365" y="97">a</text><g font-size="18"><text x="74" y="314">no a / ab suffix</text><text x="341" y="314">ends a</text><text x="578" y="314">ends ab</text></g></g></svg>
