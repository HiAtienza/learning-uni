<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" role="img"><title>Zero, one and two factors in a star</title><desc>For L={ac,bd}, k=0 gives epsilon; k=1 ac,bd; k=2 four concatenations.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#38546b"/></marker></defs><rect width="760" height="360" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" font-size="21" fill="#192e40" stroke-linejoin="round"><text x="30" y="42" font-weight="bold">L = {ac, bd}: choose blocks, then concatenate</text><g font-size="23"><text x="35" y="110">k = 0</text><text x="195" y="110">ε</text><text x="35" y="180">k = 1</text><text x="195" y="180">ac</text><text x="340" y="180">bd</text><text x="35" y="265">k = 2</text><text x="195" y="265">acac</text><text x="335" y="265">acbd</text><text x="475" y="265">bdac</text><text x="615" y="265">bdbd</text></g><path d="M215 192 L220 231 M215 192 L355 231 M355 192 L495 231 M355 192 L635 231" stroke="#288879" stroke-width="2" marker-end="url(#arrow)"/><text x="35" y="327">Each factor has length 2, so total length = 2k.</text></g></svg>
