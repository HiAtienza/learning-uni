<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" preserveAspectRatio="xMidYMid meet" role="img"><title>Every legal split keeps y inside the zeros</title><desc>For 0^p1^p, x=0^a y=0^b z=0^(p-a-b)1^p with b&gt;=1 and a+b&lt;=p.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#38546b"/></marker></defs><rect width="760" height="380" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" font-size="21" fill="#192e40" stroke-linejoin="round"><text x="28" y="38" font-weight="bold">w = 0ᵖ1ᵖ: constrain every legal split</text><g stroke="#60788c" stroke-width="2"><rect x="45" y="83" width="110" height="65" fill="#e8eef4"/><rect x="155" y="83" width="145" height="65" fill="#cde6ed"/><rect x="300" y="83" width="175" height="65" fill="#e8eef4"/><rect x="475" y="83" width="230" height="65" fill="#e6f2f0"/></g><g text-anchor="middle"><text x="100" y="122">x = 0ᵃ</text><text x="227" y="122">y = 0ᵇ</text><text x="387" y="122">0ᵖ⁻ᵃ⁻ᵇ</text><text x="590" y="122">1ᵖ</text></g><path d="M45 160 V180 H475 V160 M300 210 V230 H705 V210" fill="none" stroke="#38546b" stroke-width="2"/><text x="187" y="207">first p symbols</text><text x="496" y="258">z</text><text x="45" y="309">Pump twice: 0ᵖ⁺ᵇ1ᵖ. Since b ≥ 1, the counts differ.</text><text x="45" y="345" font-size="18">Schematic widths only. a may be 0; the zero-prefix of z may be empty.</text></g></svg>
