<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" role="img"><title>A repeated state creates a pumpable loop</title><desc>An accepting run follows x to repeated state r, y back to r, then z to a final state.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#38546b"/></marker></defs><rect width="760" height="360" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" font-size="21" fill="#192e40" stroke-linejoin="round"><text x="28" y="38" font-weight="bold">Same state before and after y: the suffix can still run</text><g fill="#e8f0f6" stroke="#38546b" stroke-width="2"><circle cx="120" cy="180" r="32"/><circle cx="380" cy="180" r="32"/><circle cx="640" cy="180" r="32"/><circle cx="640" cy="180" r="25" fill="none"/></g><text x="108" y="188">q₀</text><text x="376" y="188">r</text><text x="635" y="188">f</text><g fill="none" stroke="#38546b" stroke-width="2" marker-end="url(#arrow)"><path d="M40 180 H83"/><path d="M153 180 H343"/><path d="M413 180 H603"/><path d="M359 155 C290 65 470 65 401 155"/></g><text x="245" y="166">x</text><text x="508" y="166">z</text><text x="350" y="70">y ≠ ε</text><text x="50" y="270">0 loops: xz</text><text x="280" y="270">1 loop: xyz</text><text x="495" y="270">2 loops: xyyz</text><text x="28" y="324">Arrows abbreviate paths; x or z may consume no symbols.</text></g></svg>
