<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 385" preserveAspectRatio="xMidYMid meet" role="img"><title>Pumped length falls between consecutive squares</title><desc>p² &lt; p²+b &lt;= p²+p &lt; (p+1)² for 1&lt;=b&lt;=p and p&gt;=1.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#38546b"/></marker></defs><rect width="760" height="385" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" font-size="21" fill="#192e40" stroke-linejoin="round"><text x="28" y="38" font-weight="bold">Square lengths: the missing upper-bound argument</text><path d="M65 145 H695" stroke="#38546b" stroke-width="3" marker-end="url(#arrow)"/><g stroke="#38546b" stroke-width="2"><path d="M110 131 V159 M330 131 V159 M465 131 V159 M650 131 V159"/></g><g text-anchor="middle"><text x="110" y="194">p²</text><text x="330" y="111">p² + b</text><text x="465" y="194">p² + p</text><text x="650" y="194">(p + 1)²</text><text x="380" y="265">1 ≤ b ≤ p keeps the new length below the next square.</text><text x="380" y="313" font-size="18">Schematic spacing; p² + b may equal p² + p when b = p.</text></g><path d="M115 221 H644" stroke="#288879" stroke-width="2"/><text x="270" y="352">Gap between squares = 2p + 1</text></g></svg>
