    <script>
      // Overlap the one requested course download with module parsing.
      (() => {
        const requested = new URLSearchParams(location.hash.slice(1)).get('course') || 'SOE203';
        const code = ['SOE203', 'ADS205', 'SOE201'].includes(requested) ? requested : requested === 'CORE' ? '' : 'SOE203';
        if (!code) return;
        let language = 'es';
        try { const preference = new URLSearchParams(location.search || '').get('lang') || localStorage.getItem('learning-uni-language');language = preference === 'en' ? 'en' : 'es'; } catch { /* Default Spanish without storage. */ }
        window.learningUniPreload = { code, language, data: fetch('/learning-uni/data/courses/' + code + (language === 'es' ? '.es' : '') + '.json', {cache:'no-cache'})
          .then(response => response.ok ? response.json() : undefined).catch(() => undefined) };
      })();
    </script>
